name: Suggestion
description: An idea for a feature, or a change to how something works.
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Check the README's roadmap and the existing issues first; a thumbs-up on an existing one counts.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, not the solution yet. What's missing or gets in the way?
      placeholder: After a match I want to send one clip to friends, but Discord rejects files over 10 MB.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Screenshots or mockups help.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen elsewhere?
      description: Another app that does this well, and what it gets right.
  - type: dropdown
    id: help
    attributes:
      label: Would you work on it?
      options:
        - No, just suggesting
        - Maybe, with some guidance
        - Yes, I'd open a pull request
